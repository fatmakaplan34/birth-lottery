name: Birth Lottery checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        run: pip install --requirement requirements.txt

      - name: Verify backend and bundled country data
        env:
          COUNTRY_DATA_MODE: snapshot
        run: |
          python -m compileall -q app
          python - <<'PY'
          import asyncio
          from app.main import health
          from app.services.language_catalog import resolve_language_countries
          from app.services.restcountries import get_all_countries, merge_country_data

          async def verify():
              countries = await get_all_countries()
              assert len(countries) == 252
              assert any(country["iso3"] == "MDV" for country in countries)

              merged = merge_country_data(countries, [countries[0]])
              assert len(merged) == 252
              assert any(country["iso3"] == "MDV" for country in merged)

              _, german = resolve_language_countries(countries, "Almanca")
              german_ids = {country["iso3"] for country in german}
              assert german_ids == {"AUT", "BEL", "CHE", "DEU", "LIE", "LUX"}

              _, french = resolve_language_countries(countries, "Fransızca")
              assert "NER" not in {country["iso3"] for country in french}

              _, hausa = resolve_language_countries(countries, "Hausa")
              assert "NER" in {country["iso3"] for country in hausa}

              _, dhivehi = resolve_language_countries(countries, "Divehice")
              assert {country["iso3"] for country in dhivehi} == {"MDV"}
              assert health()["status"] == "alive"

          asyncio.run(verify())
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
